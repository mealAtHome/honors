<ons-page id="UMHM">

    <div class="common-div-headerTop">
        <table style="width:100%;">
            <tbody>
                <tr>
                    <td style="text-align:left;">
                        <div class="common-colorBody">안녕하세요</div>
                        <div class="common-colorHead"><span id="UMHM-span-username" class="common-strong" style="vertical-align:bottom;"></span>&nbsp;님</div>
                    </td>
                    <td style="text-align:right;">
                        <button id="UMHM-btn-toManager" class="common-btn-inner  common-fonts09" style="display:none;"><i class="ti ti-transform"></i>&nbsp;매니저 홈</button>
                        <button id="UMHM-btn-toAdmin"   class="common-btn-inner  common-fonts09" style="display:none;"><i class="ti ti-power" aria-hidden="true"></i>&nbsp;관리자 홈</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- =============== -->
    <!-- 공지사항 -->
    <!-- =============== -->
    <div class="common-div-cushion">
        <div class="common-div-sectionHeader">공지사항</div>
        <div id="UMHM-div-systemBoard"></div>
        <div class="common-div-block common-fonts09" style="text-align:right;">
            <button id="UMHM-btn-moreSystemBoards" class="common-btn-noline" btn-type="body">더 보기</button>
        </div>
    </div>

    <!-- =============== -->
    <!-- cushion for tab -->
    <!-- =============== -->
    <div class="common-div-cushionFooter"></div>

    <script>
        var UMHM =
        {
            code: "UMHM",
            Data: {},

            /* =============== */
            /* show */
            /* =============== */
            show()
            {
                /* recovery */
                Common.showProgress();
                setTimeout(function()
                {
                    /* 공지사항 조회 */
                    let mSystemBoards = Api.SystemBoard.selectMain();
                    mSystemBoards.makeMainBanners("#UMHM-div-systemBoard");

                    /* 모임매니저 여부 조회 */
                    let mGrps = Api.Grp.selectManaging();
                    if(mGrps.getModels().length > 0)
                        $("#UMHM-btn-toManager").show();

                    /* 내 정보 조회 */
                    let mUser = Api.User.selectMe().getModel();
                    $("#UMHM-span-username").text(`${mUser.getName()}`);
                    // mUsers.make("#UMHM-div-userInfo");

                    Common.hideProgress();
                }, ajaxDelayTime);

                // GGinitPage.setCartFab();
            },

            close()
            {
                Common.confirmExit();
            }
        };

        $(document).ready(function()
        {
            /* ======================== */
            /* set event */
            /* ======================== */
            /* $("#UMHM-btn-toAdmin").click(function() { Navigation.moveFrontPage(Navigation.Page.B01BizRegist, {}); }); */
            $("#UMHM-btn-toManager").click(function() { GGstorage.clearPageStack(); Navigation.moveFrontPage(Navigation.Page.B10ManagerChooseGrp, {}); });
            $("#UMHM-btn-test-newCls").click(function() { Navigation.moveFrontPage(Navigation.Page.F10ClassUpdate000Default, {grpno: 'GCYHTRMLKYLEXMELLYTWCUBWAWALXD'}); });
            $("#UMHM-btn-manageSchedule").click(function() { Navigation.moveFrontPage(Navigation.Page.G10ScheduleByYear); });
            $("#UMHM-btn-moreSystemBoards").click(function() { Navigation.moveFrontPage(Navigation.Page.Z21SystemBoardList, {}); });

            /* ========================= */
            /* page process */
            /* ========================= */

            /* get data from Config */
            try
            {
                UMHM.Data = Navigation.getPageParam();
                Navigation.executeShow();
            }
            catch(e)
            {
                console.error(e);
                UMHM.close(true);
            }

            /* localizing */
            /* $("#UMHM").i18n(); */

        }); /* end ready */
    </script>
</ons-page>
