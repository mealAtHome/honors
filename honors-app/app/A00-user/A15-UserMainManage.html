<ons-page id="UMMG">

    <style>
        #UMMG-span-version
        {
            font-size:0.9em;
            color: rgb(150,150,150);
        }
        #UMMG-span-version::before
        {
            content: "v";
        }
    </style>
    <div class="common-div-cushion">
        <span id="UMMG-span-version" class="common-block"></span>
    </div>

    <!-- =============== -->
    <!-- 내 정보 -->
    <!-- =============== -->
    <hr class="common-hr-paddingAA"/>
    <div class="common-div-cushion">
        <p class="common-p-title">내 정보</p>
        <div id="UMMG-div-userInfo"></div>
    </div>

    <div class="common-div-cushion common-div-manages">
        <button id="UMMG-btn-privacyDelete" class="common-btn-outer">회원탈퇴</button>
        <button id="UMMG-btn-phonePrivacy"  class="common-btn-outer">전화번호공개설정</button>
        <button id="UMMG-btn-logout"        class="common-btn-outer">로그아웃</button>
        <!-- <button id="UMMG-btn-manageUserAcctList" class="common-btn-outer">은행계좌관리</button> -->
        <!-- <button id="UMMG-btn-manageUserAddr"           class="common-btn-outer">주소설정</button> -->
        <!-- <button id="UMMG-btn-manageUserAcctRefund"     class="common-btn-outer">환불계좌설정</button> -->
        <!-- <button id="UMMG-btn-paymentMissedreq"         class="common-btn-outer">오입금(오송금) 반환신청</button> -->
    </div>

    <!-- =============== -->
    <!-- cushion for tab -->
    <!-- =============== -->
    <div class="common-div-cushionFooter"></div>

    <script>
        var UMMG =
        {
            code: "UMMG",
            Data: {},

            show()
            {
                /* set version */
                $("#UMMG-span-version").text(VERSION);

                /* recovery */
                Common.showProgress();
                setTimeout(function()
                {
                    /* 내 정보 조회 */
                    let mUsers = Api.User.selectMe();
                    mUsers.make("#UMMG-div-userInfo");

                    Common.hideProgress();
                }, ajaxDelayTime);

            },


            /* ========================= */
            /* close */
            /* ========================= */
            close(force=false)
            {
                if(force == true)
                {
                    Navigation.moveBack();
                    return;
                }
                Common.confirmExit();
            },
        };

        $(document).ready(function()
        {
            /* ======================== */
            /* set event */
            /* ======================== */
            $("#UMMG-btn-privacyDelete") .click(function() { Navigation.moveFrontPage(Navigation.Page.A02UserPrivacyDelete, {}); });
            $("#UMMG-btn-phonePrivacy")  .click(function() { Navigation.moveFrontPage(Navigation.Page.A1011ManagePhonePrivacy, {}); });
            // $("#UMMG-btn-manageUserAddr")         .click(function() {Navigation.moveFrontPage(Navigation.Page.B21UserAddrList, {}); });
            // $("#UMMG-btn-manageUserAcctRefund")   .click(function() {Navigation.moveFrontPage(Navigation.Page.B32UserBaccnoRefundUpdate, {}); });
            // $("#UMMG-btn-paymentMissedreq")       .click(function() {Navigation.moveFrontPage(Navigation.Page.B33UserPaymentMissedreq, {}); });

            /* ------------ */
            /* logout */
            /* ------------ */
            $("#UMMG-btn-logout").click(function()
            {
                /* 로그아웃 함수 정의 */
                let logout = function()
                {
                    GGstorage.logout();
                };

                /* 로그아웃 실시 */
                Common.confirm
                ({
                    title : "로그아웃",
                    msg : "로그아웃하시겠습니까?",
                    okCallback : logout
                });
            });

            /* ========================= */
            /* page process */
            /* ========================= */

            /* get data from Config */
            try
            {
                UMMG.Data = Navigation.getPageParam();
                Navigation.executeShow();
            }
            catch(e)
            {
                console.error(e);
                UMMG.close(true);
            }

            /* localizing */
            /* $("#UMMG").i18n(); */

        });
    </script>
</ons-page>
