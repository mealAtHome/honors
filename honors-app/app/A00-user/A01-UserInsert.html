<ons-page id="UINT" style="overflow-x: hidden;">

    <!-- ======================== -->
    <!-- main page -->
    <!-- ======================== -->
    <div id="UINT-div-slideformParent" class="common-div-slideformParent">

        <div class="common-div-header">
            <div header="back"><gg-backbtn onclick="UINT.close()"></gg-backbtn></div>
            <div header="title"><span>회원가입</span></div>
        </div>
        <div class="common-div-headerPadding"></div>
        <div class="common-div-progressContainer">
            <div class="common-div-progressBar" id="UINT-div-progress" style="width:25%;"></div>
        </div>

        <!-- ======================== -->
        <!-- 로그인정보 -->
        <!-- ======================== -->
        <div class="common-div-slideformChild" slideform-status="open" id="UINT-div-id" slideform-next="#UINT-div-personal1" slideform-progress="#UINT-div-progress" slideform-progressval="25">
            <div class="common-div-headerPadding"></div>

            <!-- 타이틀 -->
            <div class="common-div-formTitle">
                <span>로그인 정보</span>
            </div>

            <!-- 아이디 -->
            <div class="common-div-formField">
                <span>로그인 아이디</span>
                <span>영문숫자조합, 30글자이내</span>
                <input id="UINT-input-id" type="text" class="common-input-field" placeholder="아이디">
            </div>

            <!-- 로그인정보 -->
            <div class="common-div-formField">
                <span>비밀번호</span>
                <input id="UINT-input-pw" class="common-input-field" type="password" placeholder="비밀번호">
                <button class="common-btn-outer common-cushionUD" id="UINT-btn-pwShow">비밀번호 보기</button>
                <button class="common-btn-outer common-cushionUD" id="UINT-btn-pwHide" style="display:none;">비밀번호 숨기기</button>
            </div>

            <!-- 로그인정보 -->
            <div id="UINT-div-pwViewer" class="common-div-formField" style="display:none;">
                <span>비밀번호확인</span>
                <input id="UINT-input-pwRe" class="common-input-field" type="text" disabled>
            </div>

            <!-- 다음으로 -->
            <table class="common-tbl-slideformFooterBtn" tbl-type="button1">
                <tbody>
                    <tr>
                        <td><button id="UINT-btn-nextFromLogin" class="common-btn-inner">다음으로</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ======================== -->
        <!-- 개인정보1 -->
        <!-- ======================== -->
        <div class="common-div-slideformChild" slideform-status="wait" id="UINT-div-personal1" slideform-next="#UINT-div-personal2" slideform-prev="#UINT-div-id" slideform-progress="#UINT-div-progress" slideform-progressval="50">
            <div class="common-div-headerPadding"></div>

            <!-- 타이틀 -->
            <div class="common-div-formTitle">
                <span>개인정보-1</span>
            </div>

            <!-- 이름 -->
            <div class="common-div-formField">
                <span>이름</span>
                <span>(실명으로 입력해주세요)</span>
                <input id="UINT-input-name" type="text" class="common-input-field" placeholder="이름">
            </div>

            <!-- 출생년도 -->
            <div class="common-div-formField">
                <span>출생년도</span>
                <span>(선택입력)</span>
                <input id="UINT-input-birthYear" type="number" class="common-input-field" placeholder="예: 1980">
            </div>

            <!-- 휴대전화번호 -->
            <div class="common-div-formField">
                <span>휴대전화번호</span>
                <span>(선택입력)</span>
                <input id="UINT-input-phone" class="common-input-field" type="text" placeholder="휴대전화번호">
            </div>

            <!-- 다음으로 -->
            <table class="common-tbl-slideformFooterBtn" tbl-type="button2">
                <tbody>
                    <tr>
                        <td><button id="UINT-btn-prevFromPersonal1" class="common-btn-outer">뒤로</button></td>
                        <td><button id="UINT-btn-nextFromPersonal1" class="common-btn-inner">다음으로</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ======================== -->
        <!-- 개인정보2 -->
        <!-- ======================== -->
        <div class="common-div-slideformChild" slideform-status="wait" id="UINT-div-personal2" slideform-next="#UINT-div-thanks" slideform-prev="#UINT-div-personal1" slideform-progress="#UINT-div-progress" slideform-progressval="75">
            <div class="common-div-headerPadding"></div>

            <!-- 타이틀 -->
            <div class="common-div-formTitle">
                <span>개인정보-2</span>
            </div>

            <!-- 지역 -->
            <div class="common-div-formField">
                <span>*지역 (동/읍/면)</span>
                <span>내 주변 모임을 찾는 데 사용됩니다.</span>
                <div id="UINT-div-addrSelected" class="common-strong common-cushionHalfUp">지역을 선택해주세요.</div>
                <input id="UINT-input-addrKeyword" type="text" class="common-input-field" placeholder="동/읍/면 이름으로 검색" style="margin-top:var(--marHalf);"/>
                <div id="UINT-div-addrResultList" class="common-cushionHalfUp" style="display:none;"></div>
            </div>

            <!-- 주요활동지점 -->
            <div class="common-div-formField">
                <span>*주요활동지점</span>
                <span>지도를 움직여 자주 활동하는 위치를 지정해주세요.</span>
                <div id="UINT-div-mapContainer" style="position:relative; width:100%; height:12em; margin-top:var(--marHalf); border-radius:var(--padHalf); overflow:hidden; background:var(--colorLine);">
                    <div id="UINT-div-map" style="width:100%; height:100%;"></div>
                    <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-100%); pointer-events:none; z-index:1000;">
                        <i class="ti ti-map-pin" style="font-size:2em; color:var(--colorErrr); text-shadow:0 1px 3px rgba(250,0,0,0.4);"></i>
                    </div>
                </div>
            </div>

            <!-- 자차여부 -->
            <div class="common-div-formField">
                <span>자차여부</span>
                <span>(모임수집정보)</span>
                <table style="margin-bottom:0.5em;">
                    <tbody>
                        <tr>
                            <td><label class="common-label-radio"><input type="radio" class="UINT-radio-hascarflg" name="UINT-radio-hascarflg" value="y" checked/><span></span></label></td><td style="padding-right:1.2em;"><span>🚗자차있음</span></td>
                            <td><label class="common-label-radio"><input type="radio" class="UINT-radio-hascarflg" name="UINT-radio-hascarflg" value="n"/><span></span></label></td><td style="padding-right:0.2em;"><span>자차없음</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 활동중인 팀 -->
            <div class="common-div-formField">
                <span>활동중인 팀</span>
                <span>(필수)</span>
                <input id="UINT-input-teamname" class="common-input-field" placeholder="활동중인 팀 이름">
            </div>

            <!-- 다음으로 -->
            <table class="common-tbl-slideformFooterBtn" tbl-type="button2">
                <tbody>
                    <tr>
                        <td><button id="UINT-btn-prevFromPersonal2" class="common-btn-outer">뒤로</button></td>
                        <td><button id="UINT-btn-nextFromPersonal2" class="common-btn-inner">회원가입</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ======================== -->
        <!-- 감사합니다 -->
        <!-- ======================== -->
        <div class="common-div-slideformChild" slideform-status="wait" id="UINT-div-thanks" slideform-prev="#UINT-div-personal2" slideform-progress="#UINT-div-progress" slideform-progressval="100">
            <div class="common-div-headerPadding"></div>

            <!-- 타이틀 -->
            <div class="common-div-formTitle">
                <span>감사합니다!</span>
                <span>회원가입이 완료되었습니다.</span>
            </div>

            <!-- 다음으로 -->
            <table class="common-tbl-slideformFooterBtn" tbl-type="button1">
                <tbody>
                    <tr>
                        <td><button id="UINT-btn-nextFromThanks" class="common-btn-inner">메인으로 이동</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ======================== -->
        <!-- 저장하기 -->
        <!-- ======================== -->
        <!-- <button id="UINT-btn-save" class="common-btn-footer">회원가입</button>
        <div class="common-div-cushionFooter"></div> -->
    </div>



    <script>

        var UINT =
        {
            code : "UINT",
            userImgUri: null,
            Data: { selectedAddrcode: null, selectedLat: 37.5665, selectedLng: 126.9780, mapInited: false },

            show()
            {


            },

            /* ===================== */
            /* 지도 초기화 (개인정보2 슬라이드로 진입할 때 1회) */
            /* ===================== */
            initMap()
            {
                if(UINT.Data.mapInited) return;
                UINT.Data.mapInited = true;

                if(window.naver == undefined || naver.maps == undefined)
                {
                    $("#UINT-div-map").html(`<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--colorCmmt); font-size:0.85em; text-align:center; padding:0 1em;">지도 API를 불러올 수 없습니다.</div>`);
                    return;
                }

                UINT.Data.map = new naver.maps.Map("UINT-div-map",
                {
                    center: new naver.maps.LatLng(UINT.Data.selectedLat, UINT.Data.selectedLng),
                    zoom: 15,
                });

                naver.maps.Event.once(UINT.Data.map, "init", function()
                {
                    UINT.Data.map.setCenter(new naver.maps.LatLng(UINT.Data.selectedLat, UINT.Data.selectedLng));
                });

                naver.maps.Event.addListener(UINT.Data.map, "idle", function()
                {
                    let center = UINT.Data.map.getCenter();
                    UINT.Data.selectedLat = center.lat();
                    UINT.Data.selectedLng = center.lng();
                });
            },

            /* ===================== */
            /* 지역 선택 시, 지도를 그 지역으로 이동 (지오코딩) */
            /* ===================== */
            moveMapToAddr(addrstrfull)
            {
                if(window.naver == undefined || naver.maps.Service == undefined) return;
                naver.maps.Service.geocode({query: addrstrfull}, function(status, response)
                {
                    if(status !== naver.maps.Service.Status.OK) { return; }
                    if(response.v2.meta.totalCount === 0) { return; }

                    let item = response.v2.addresses[0];
                    let point = new naver.maps.LatLng(item.y, item.x);

                    UINT.Data.map.setCenter(point);
                    UINT.Data.selectedLat = point.lat();
                    UINT.Data.selectedLng = point.lng();
                });
            },

            /* ===================== */
            /* 지역검색 */
            /* ===================== */
            searchAddr(keyword)
            {
                ApiPr.Addrcode.searchByKeyword(keyword, GGF.none, GGF.toast)
                .done(function(mAddrcodes)
                {
                    mAddrcodes.makeAddrcodeForChoose("#UINT-div-addrResultList");
                    $("#UINT-div-addrResultList").show();
                });
            },

            close()
            {
                Common.confirmClose();
            },
        };


        $(document).ready(function()
        {
            /* =============================== */
            /* events */
            /* =============================== */

            /* 비밀번호 보기 */
            $("#UINT-btn-pwShow").click(function() { $("#UINT-div-pwViewer").show(); $("#UINT-btn-pwShow").hide(); $("#UINT-btn-pwHide").show(); });
            $("#UINT-btn-pwHide").click(function() { $("#UINT-div-pwViewer").hide(); $("#UINT-btn-pwShow").show(); $("#UINT-btn-pwHide").hide(); });
            $("#UINT-input-pw").keyup(function() {
                $("#UINT-input-pwRe").val($(this).val());
            });

            /* --------------- */
            /* 입력폼 : 로그인 */
            /* --------------- */
            $("#UINT-btn-nextFromLogin").click(function()
            {
                /* 입력체크 */
                if(!GGvalid.User.id("#UINT-input-id", GGF.toast)) return;
                if(!GGvalid.User.pw("#UINT-input-pw", GGF.toast)) return;

                /* 아이디 중복체크 */
                Common.showProgress();
                setTimeout(function()
                {
                    let id = $("#UINT-input-id").val();
                    let mUsers = Api.User.selectCntById(id);
                    if(mUsers.getCnt() == "0") {
                        GGslideform.next("#UINT-div-slideformParent");
                    }
                    else {
                        Common.toast("이미 사용중인 아이디입니다.");
                        $("#UINT-input-id").focus();
                        $("#UINT-input-id").select();
                    }
                    Common.hideProgress();
                }, ajaxDelayTime);
            });

            /* --------------- */
            /* 개인정보1 */
            /* --------------- */
            $("#UINT-btn-nextFromPersonal1").click(function() {
                if(!GGvalid.User.name("#UINT-input-name", GGF.toast))
                    return;
                GGslideform.next("#UINT-div-slideformParent");
                setTimeout(function() { UINT.initMap(); }, 300);
            });
            $("#UINT-btn-prevFromPersonal1").click(function() { GGslideform.prev("#UINT-div-slideformParent"); });

            /* --------------- */
            /* 지역검색 : 타이핑 중 검색 */
            /* --------------- */
            let addrSearchTimer = null;
            $("#UINT-input-addrKeyword").on("keyup", function()
            {
                let keyword = $(this).val().trim();
                clearTimeout(addrSearchTimer);
                if(keyword == "") { $("#UINT-div-addrResultList").hide().html(""); return; }
                addrSearchTimer = setTimeout(function() { UINT.searchAddr(keyword); }, 300);
            });

            /* 지역검색 결과 선택 */
            $("#UINT-div-addrResultList").on("click", ".MAddrcode-makeForChoose-row", function()
            {
                let addrcode = $(this).attr("addrcode");
                let addrstrfull = $(this).attr("addrstrfull");
                let isChanged = UINT.Data.selectedAddrcode != addrcode;

                UINT.Data.selectedAddrcode = addrcode;
                $("#UINT-div-addrSelected").text(addrstrfull);
                $("#UINT-input-addrKeyword").val("");
                $("#UINT-div-addrResultList").hide().html("");

                if(isChanged)
                    UINT.moveMapToAddr(addrstrfull);
            });

            /* --------------- */
            /* 개인정보2 */
            /* --------------- */
            $("#UINT-btn-nextFromPersonal2").click(function()
            {
                if(Common.isEmpty(UINT.Data.selectedAddrcode)) { Common.toastError("지역을 선택해주세요."); return; }

                Common.showProgress();
                setTimeout(function()
                {
                    let id          = $("#UINT-input-id").val();
                    let pw          = $("#UINT-input-pw").val();
                    let name        = $("#UINT-input-name").val();
                    let birthYear   = $("#UINT-input-birthYear").val();
                    let phone       = $("#UINT-input-phone").val();
                    let email       = ""; /* $("#UINT-input-email").val(); */
                    let adrcvflg    = "n"; /* $(".UINT-radio-adrcvflg:checked").val(); */
                    let hascar      = $(".UINT-radio-hascarflg:checked").val();
                    let teamname    = $("#UINT-input-teamname").val();
                    let rslt = Api.User.insert(id, pw, name, birthYear, phone, email, adrcvflg, hascar, UINT.Data.selectedAddrcode, UINT.Data.selectedLat, UINT.Data.selectedLng, teamname, GGF.toast, GGF.alert);
                    if(rslt == false) {
                        Common.hideProgress();
                        return;
                    }

                    /* 등록에 성공했다면, 다음 슬라이드로 이동 */
                    if(GGstorage.isLogin()) {
                        GGslideform.next("#UINT-div-slideformParent");
                    }
                    Common.hideProgress();
                }, ajaxDelayTime);
                // GGslideform.next("#UINT-div-slideformParent");
            });
            $("#UINT-btn-prevFromPersonal2").click(function() { GGslideform.prev("#UINT-div-slideformParent"); });

            /* --------------- */
            /* 감사합니다 */
            /* --------------- */
            $("#UINT-btn-nextFromThanks").click(function()
            {
                Navigation.moveAfterLogin();
            });


            /* ========================= */
            /* page process */
            /* ========================= */
            /* ------------- */
            /* set pageParam */
            /* ------------- */
            let pageDat = Navigation.getPageParam();

            /* localizing */
            $("#UINT").i18n();

        });

    </script>
</ons-page>
