<ons-page id="DGRP">

    <!-- ======================== -->
    <!-- 페이지용 타이틀 -->
    <!-- ======================== -->
    <div class="common-div-toolbar">
        <div><gg-backbtn onclick="DGRP.close(true);"></gg-backbtn></div>
        <div><span>모임상세</span></div>
    </div>

    <!-- ========================= -->
    <!-- 선택 -->
    <!-- ========================= -->
    <div class="common-maintab-top common-fonts09">
        <div class="DGRP-div-searchtype common-maintab-item" val="detail" tab="tab"><i class="ti ti-home"></i><span>홈</span></div>
        <div class="DGRP-div-searchtype common-maintab-item" val="cls"    tab=""   >일정</div>
        <div class="DGRP-div-searchtype common-maintab-item" val="member" tab=""   >멤버</div>
    </div>
    <!-- <hr class="common-hr-paddingLR"/> -->

    <!-- ========================= -->
    <!-- 탭 -->
    <!-- ========================= -->

    <!-- 기본정보 -->
    <div class="DGRP-div-tab common-div-cushion" tab="detail">
        <div id="DGRP-div-info"></div>
    </div>

    <!-- 일정 -->
    <div class="DGRP-div-tab" tab="cls" style="display:none;">
        <div class="common-div-cushion">
            <table class="common-tbl-tab commonEvent-tbl-tab">
                <tbody>
                    <tr>
                        <td class="DGRP-td-clsSubtype" val="ing"    tab="tab" >진행중</td>
                        <td class="DGRP-td-clsSubtype" val="settle" tab=""    >정산중</td>
                        <td class="DGRP-td-clsSubtype" val="end"    tab=""    >완료</td>
                        <td class="DGRP-td-clsSubtype" val="cancel" tab=""    >취소</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <hr class="common-hr-paddingLR"/>
        <div id="DGRP-div-clsList" class="common-div-cushion"></div>
    </div>

    <!-- 멤버 -->
    <div class="DGRP-div-tab common-div-cushion" tab="member" style="display:none;">
        <div id="DGRP-div-search" class="common-search-top common-div-cushionUD">
            <input type="text" id="DGRP-input-searchkey" class="common-input-text"/>
            <button id="DGRP-btn-search" class="common-btn-outer"><i class="ti ti-search"></i><span>검색</span></button>
            <div class="common-block common-fonts09">
                <span id="DGRP-span-searchedCnt"></span><span>건 검색되었습니다.</span>
            </div>
        </div>
        <div id="DGRP-div-memberList"></div>
    </div>


    <script>
        var DGRP =
        {
            code : "DGRP",

            /* ========================= */
            /*
                페이지 데이터
            */
            /* ========================= */
            Data : {},

            show()
            {
                /* validation param */
                if(DGRP.Data.grpno      == undefined) { Common.toast("잘못된 접근입니다."); DGRP.close(); return; }
                if(DGRP.Data.searchtype == undefined) { DGRP.Data.searchtype = "detail"; } /* 기본값 */
                if(DGRP.Data.searchkey  == undefined) { DGRP.Data.searchkey = ""; } /* 기본값 */
                if(DGRP.Data.pagenoGrpm == undefined) { DGRP.Data.pagenoGrpm = 1; } /* 기본값 */
                if(DGRP.Data.pagenoCls  == undefined) { DGRP.Data.pagenoCls  = 1; } /* 기본값 */
                if(DGRP.Data.clsSubtype == undefined) { DGRP.Data.clsSubtype = "ing"; } /* 기본값 */

                /* set searchkey */
                $("#DGRP-input-searchkey").val(DGRP.Data.searchkey);

                /* init */
                $(`.DGRP-div-searchtype[val='${DGRP.Data.searchtype}']`).click();
            },

            /* ========================= */
            /* 가입 카드 : 모임의 가입 방식과 내 상태(멤버 / 대기 / 없음)에 따라 */
            /* ========================= */
            makeJoinCard(mGrp)
            {
                let grpno = mGrp.getGrpno();
                let mGrpMember = Api.GrpMember.selectMeByGrpno(grpno, GGF.none, GGF.none);
                if(mGrpMember != null && mGrpMember.getGrpmtype() != GGF.GrpMember.Grpmtype.GUEST)
                    return ""; /* 이미 멤버 */

                let card = (title, body) => `<div class="common-div-card"><div class="common-header"><i class="ti ti-user-plus"></i><span>${title}</span></div><div class="common-cushionHalfUp">${body}</div></div>`;

                if(mGrp.getGrpjoinpolicy() == GGF.Grp.Joinpolicy.NONE)
                    return card("용병으로 참가하기", `<span class="common-fonts09">가입 없이 용병 모집 일정에 참가하는 모임입니다. 일정 탭이나 [용병 모집 찾기]에서 참가해주세요.</span>`);

                let mReq = Api.GrpJoinreq.selectMineByGrpnoForUsr(grpno, GGF.none, GGF.none);
                if(mReq != null && mReq.isWait())
                    return card("가입신청 현황", `
                        <span class="common-block common-fonts09">가입 승인을 기다리고 있습니다. 매니저가 승인하면 멤버가 됩니다.</span>
                        <button class="DGRP-btn-joinCancel common-btn-outer" btn-type="cancel" btn-size="large">신청 취소</button>
                    `);

                let rejected = (mReq != null && mReq.isRejected()) ? `<span class="common-block common-fonts09 common-colorCmmt">이전 가입신청이 거절되었습니다. 다시 신청할 수 있습니다.</span>` : "";
                if(mGrp.getGrpjoinpolicy() == GGF.Grp.Joinpolicy.FREE)
                    return card("이 모임에 가입하기", `
                        ${rejected}
                        <span class="common-block common-fonts09">신청하면 바로 멤버가 됩니다.</span>
                        <button class="DGRP-btn-joinRequest common-btn-inner" btn-size="large">바로 가입하기</button>
                    `);

                return card("가입신청하기", `
                    ${rejected}
                    <textarea id="DGRP-textarea-reqmsg" class="common-textarea-field" rows="3" maxlength="200" placeholder="가입인사 (선택, 200자 이내)" style="width:100%; box-sizing:border-box;"></textarea>
                    <span class="common-block common-fonts08 common-colorCmmt">매니저가 승인하면 멤버가 됩니다.</span>
                    <button class="DGRP-btn-joinRequest common-btn-inner" btn-size="large">가입신청</button>
                `);
            },

            /* ========================= */
            /* search */
            /* ========================= */
            search()
            {
                Common.showProgress();
                setTimeout(function()
                {
                    try
                    {
                        /* get var */
                        let grpno = DGRP.Data.grpno;
                        let userno = DGRP.Data.userno;
                        let searchtype = DGRP.Data.searchtype;

                        /* 탭별표시 */
                        switch(searchtype)
                        {
                            case "detail":
                            {
                                /* 모임정보 */
                                let mGrp = Api.Grp.selectByPk(grpno, GGF.none, GGF.toast);
                                let infoHtml = mGrp.makeGrpCardMain();

                                /* 가입 카드 : 모임 카드 바로 아래 */
                                infoHtml += DGRP.makeJoinCard(mGrp);

                                /* 모임장 연락처 */
                                infoHtml += mGrp.makeManagerContactCard();

                                /* 모임소개글 (API를 별도로 한 번 더 호출) */
                                let mGrpIntro = Api.GrpIntro.selectByPk(grpno, GGF.none, GGF.toast);
                                if(mGrpIntro != null)
                                    infoHtml += mGrpIntro.make(mGrp.getGrpintro());

                                $("#DGRP-div-info").html(infoHtml);
                                break;
                            }
                            case "cls":
                            {
                                /* 서브탭 활성화 표시 */
                                $(".DGRP-td-clsSubtype").attr("tab", "");
                                $(`.DGRP-td-clsSubtype[val='${DGRP.Data.clsSubtype}']`).attr("tab", "tab");

                                /* 일정검색 (서브탭 구분별) */
                                let pagenumCls = DGRP.Data.pagenoCls;
                                let mClss = null;
                                switch(DGRP.Data.clsSubtype)
                                {
                                    case "ing"    : mClss = Api.Cls.selectForAllByClsstatusIng(grpno, pagenumCls, GGF.none, GGF.toast); break;
                                    case "settle" : mClss = Api.Cls.selectForAllByClssettleflgN(grpno, pagenumCls, GGF.none, GGF.toast); break;
                                    case "end"    : mClss = Api.Cls.selectForAllByClsstatusEnd(grpno, pagenumCls, GGF.none, GGF.toast); break;
                                    case "cancel" : mClss = Api.Cls.selectForAllByClsstatusCancel(grpno, pagenumCls, GGF.none, GGF.toast); break;
                                }
                                mClss.make("#DGRP-div-clsList");

                                /* pagenation event */
                                $("#DGRP-div-clsList .common-btn-pagenationBtn").click(function()
                                {
                                    let toPage = $(this).attr("to_page");
                                    DGRP.Data.pagenoCls = toPage;
                                    DGRP.search();
                                });

                                break;
                            }
                            case "member":
                            {
                                let searchkey = $("#DGRP-input-searchkey").val();
                                DGRP.Data.searchkey = searchkey;

                                /* 멤버검색 */
                                let pagenum = DGRP.Data.pagenoGrpm;
                                let mGrpMembers = Api.GrpMember.selectByKeywordWithPageForAll(pagenum, grpno, searchkey);
                                mGrpMembers.makeGrpMembers("#DGRP-div-memberList");

                                /* 검색건수 표시 */
                                $("#DGRP-span-searchedCnt").text(mGrpMembers.getAllcnt());

                                /* pagenation event */
                                $("#DGRP-div-memberList .common-btn-pagenationBtn").click(function()
                                {
                                    let toPage = $(this).attr("to_page");
                                    DGRP.Data.pagenoGrpm = toPage;
                                    $("#DGRP-btn-search").click();
                                });
                                break;
                            }
                        }
                        /* show / hide */
                        $(".DGRP-div-tab").hide();
                        $(`.DGRP-div-tab[tab='${searchtype}']`).show();
                    }
                    catch(e)
                    {
                        Common.catchProc(e);
                    }
                    Common.hideProgress();
                }, ajaxDelayTime);
            },

            /* ========================= */
            /* close */
            /* ========================= */
            close(force=false)
            {
                if(force == true)
                {
                    Navigation.moveBack();
                    return;
                }
                Navigation.moveBack();
            },
        }

        $(document).ready(function()
        {
            /* ========================= */
            /* event */
            /* ========================= */

            $(".DGRP-div-searchtype").click(function()
            {
                let searchtype = $(this).attr("val");
                DGRP.Data.searchtype = searchtype; /* save selected */
                DGRP.search(); /* search */
            });

            /* =============== */
            /* 일정 서브탭 (진행중/정산중/완료/취소) */
            /* =============== */
            $(".DGRP-td-clsSubtype").click(function()
            {
                let clsSubtype = $(this).attr("val");
                DGRP.Data.clsSubtype = clsSubtype; /* 선택값 저장 */
                DGRP.Data.pagenoCls = 1; /* 서브탭 전환 시 페이지 초기화 */
                DGRP.search(); /* search */
            });

            /* =============== */
            /* 검색 */
            /* =============== */
            /* 가입신청 / 바로 가입 */
            $("#DGRP-div-info").on("click", ".DGRP-btn-joinRequest", function()
            {
                let reqmsg = ($("#DGRP-textarea-reqmsg").val() || "").trim();
                let process = function()
                {
                    Common.showProgress();
                    setTimeout(function()
                    {
                        let mApiResponse = Api.GrpJoinreq.requestForUsr(DGRP.Data.grpno, reqmsg, GGF.toast, GGF.toast);
                        Common.hideProgress();
                        if(mApiResponse.isSuccess())
                            Navigation.executeShow();
                    }, ajaxDelayTime);
                };
                Common.confirm2("이 모임에 가입하시겠습니까?", process);
            });

            /* 가입신청 취소 */
            $("#DGRP-div-info").on("click", ".DGRP-btn-joinCancel", function()
            {
                let process = function()
                {
                    Common.showProgress();
                    setTimeout(function()
                    {
                        let mApiResponse = Api.GrpJoinreq.cancelForUsr(DGRP.Data.grpno, GGF.toast, GGF.toast);
                        Common.hideProgress();
                        if(mApiResponse.isSuccess())
                            Navigation.executeShow();
                    }, ajaxDelayTime);
                };
                Common.confirm2("가입신청을 취소하시겠습니까?", process);
            });

            $("#DGRP-input-searchkey").keypress(function(e) { if(e.key == "Enter") $("#DGRP-btn-search").click(); });
            $("#DGRP-btn-search").click(function()
            {
                DGRP.search();
            });

            /* ========================= */
            /* page process */
            /* ========================= */

            /* get data from Config */
            try
            {
                DGRP.Data = Navigation.getPageParam();
                Navigation.executeShow();
            }
            catch(e)
            {
                console.error(e);
                DGRP.close(true);
            }

            /* localizing */
            /* $("#DGRP").i18n(); */

        }); /* end function */

    </script>
</ons-page>
