<ons-page id="MMMB">

    <!-- ======================== -->
    <!-- 페이지용 타이틀 -->
    <!-- ======================== -->
    <div class="common-div-toolbar">
        <div><gg-backbtn onclick="MMMB.close(true);"></gg-backbtn></div>
        <div><span>모임멤버</span></div>
    </div>

    <!-- ======================== -->
    <!-- 상단탭 : 멤버 / 태그 -->
    <!-- ======================== -->
    <div class="common-tabbar-top" style="top:3em;">
        <div class="common-tabbar-item MMMB-searchtab-item" searchtab="member" tab="tab" >멤버</div>
        <div class="common-tabbar-item MMMB-searchtab-item" searchtab="tag"    tab=""    >태그</div>
    </div>
    <!-- <hr class="common-hr-paddingLR"/> -->

    <!-- ======================== -->
    <!-- 멤버탭 : 선택 -->
    <!-- ======================== -->
    <div class="MMMB-div-searchtab" searchtab="member">
        <div class="common-div-cushion">
            <table class="common-tbl-tab commonEvent-tbl-tab">
                <tbody>
                    <tr>
                        <td class="MMMB-td-searchtype" searchtype="all"       tab="tab" >전체</td>
                        <td class="MMMB-td-searchtype" searchtype="manager"   tab=""    >관리자</td>
                        <td class="MMMB-td-searchtype" searchtype="normem"    tab=""    >멤버</td>
                        <td class="MMMB-td-searchtype" searchtype="tmpmem"    tab=""    >임시</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ======================== -->
    <!-- 태그탭 : 태그 목록(pill) -->
    <!-- ======================== -->
    <div class="MMMB-div-searchtab" searchtab="tag" style="display:none;">
        <div class="common-div-cushion">
            <div id="MMMB-div-tagList" class="common-inline common-fonts09"></div>
            <button id="MMMB-btn-tagManage" class="common-btn-outer common-fonts09">태그관리</button>
        </div>
    </div>

    <!-- ========================= -->
    <!-- 검색 -->
    <!-- ========================= -->
    <div class="common-div-cushion common-search-div-top">
        <input type="text" id="MMMB-input-searchkey" class="common-input-text"/>
        <button id="MMMB-btn-search" class="common-btn-outer"><i class="ti ti-search"></i><span>&nbsp;검색</span></button>
        <div class="common-block common-fonts09">
            <span id="MMMB-span-searchedCnt"></span><span>건 검색되었습니다.</span>
        </div>
    </div>

    <!-- ========================= -->
    <!-- list -->
    <!-- ========================= -->
     <hr class="common-hr-paddingLR"/>
    <div id="MMMB-div-list" class="common-div-cushion"></div>

    <div class="common-div-cushionFooter"></div>
    <script>
        var MMMB =
        {
            code : "MMMB",

            show()
            {
                if(MMMB.Data.grpno         == undefined) { Common.toast("잘못된 접근입니다."); MMMB.close(); return; }
                if(MMMB.Data.searchtab     == undefined) { MMMB.Data.searchtab = "member"; }
                if(MMMB.Data.searchtype    == undefined) { MMMB.Data.searchtype = "all"; }
                if(MMMB.Data.searchkey     == undefined) { MMMB.Data.searchkey = ""; }
                if(MMMB.Data.searchtagidx  == undefined) { MMMB.Data.searchtagidx = ""; }
                if(MMMB.Data.pagenum       == undefined) { MMMB.Data.pagenum = 1; }

                /* restore input */
                $("#MMMB-input-searchkey").val(MMMB.Data.searchkey);

                /* get tags */
                Common.showProgress();
                setTimeout(function()
                {
                    let searchtab = MMMB.Data.searchtab;
                    let searchtype = MMMB.Data.searchtype;
                    let searchtagidx = MMMB.Data.searchtagidx;
                    let mGrpmtagas = Api.Grpmtaga.selectByGrpno(MMMB.Data.grpno);
                    mGrpmtagas.makePillForSearchGrpm("#MMMB-div-tagList");

                    /* 태그 클릭 시, 태그에 해당하는 멤버만 검색 */
                    $("#MMMB-div-tagList > .MGrpmtaga-makePillForSearchGrpm-pill").click(function()
                    {
                        /* set tab */
                        $(`#MMMB-div-tagList > .MGrpmtaga-makePillForSearchGrpm-pill`).attr("tab", "");
                        $(this).attr("tab", "tab");

                        /* search */
                        let grpno = $(this).attr("grpno");
                        let tagidx = $(this).attr("tagidx");
                        MMMB.Data.searchtagidx = tagidx;
                        MMMB.search();
                    });

                    /* search members */
                    $(`.MMMB-searchtab-item[searchtab='${searchtab}']`).click();
                    switch(searchtab)
                    {
                        case "member" : { $(`.MMMB-td-searchtype[searchtype='${searchtype}']`).click(); break; }
                        case "tag"    : { $(`#MMMB-div-tagList > .MGrpmtaga-makePillForSearchGrpm-pill[tagidx='${searchtagidx}']`).click(); break; }
                    }

                    Common.hideProgress();
                }, ajaxDelayTime);
            },

            search()
            {
                Common.showProgress();
                setTimeout(function()
                {
                    let grpno = MMMB.Data.grpno;
                    let pagenum = MMMB.Data.pagenum;
                    let searchtab = MMMB.Data.searchtab;
                    let searchtype = MMMB.Data.searchtype;
                    let searchtagidx = MMMB.Data.searchtagidx;
                    let searchkey = $("#MMMB-input-searchkey").val();

                    /* search */
                    let mGrpMembers = null;
                    switch(searchtab)
                    {
                        case "member":
                        {
                            mGrpMembers = Api.GrpMember.selectByGrpnoUsernameSearchtypeForAll (pagenum, MMMB.Data.grpno, searchkey, searchtype);
                            break;
                        }
                        case "tag":
                        {
                            if(Common.isEmpty(searchtagidx))
                            {
                                Common.hideProgress();
                                return;
                            }
                            mGrpMembers = Api.GrpMember.selectByGrpnoUsernameTagidxForAll     (pagenum, MMMB.Data.grpno, searchkey, searchtagidx);
                            break;
                        }
                    }
                    mGrpMembers.make("#MMMB-div-list");
                    $("#MMMB-span-searchedCnt").text(mGrpMembers.getAllcnt());

                    /* set event */
                    $("#MMMB-div-list .common-btn-pagenationBtn").click(function()
                    {
                        let toPage = $(this).attr("to_page");
                        MMMB.Data.pagenum = toPage;
                        MMMB.search();
                    });

                    /* save selected */
                    MMMB.Data.searchkey = searchkey;

                    Common.hideProgress();
                }, ajaxDelayTime);
            },

            /* ========================= */
            /* close */
            /* ========================= */
            close(force=false)
            {
                Navigation.moveBack();
            },
        }

        $(document).ready(function()
        {
            /* ========================= */
            /* event */
            /* ========================= */

            /* 상단탭 */
            $(".MMMB-searchtab-item").click(function()
            {
                let searchtab = $(this).attr("searchtab");
                $(".MMMB-div-searchtab").hide();
                $(`.MMMB-div-searchtab[searchtab='${searchtab}']`).show();

                /* set vars */
                MMMB.Data.searchtab = searchtab;
                MMMB.search();
            });

            /* 멤버타입선택 */
            $(".MMMB-td-searchtype").click(function()
            {
                MMMB.Data.pagenum = 1;
                MMMB.Data.searchtype = $(this).attr("searchtype");
                MMMB.search();
            });

            /* 멤버검색 */
            $("#MMMB-btn-search").click(function()
            {
                MMMB.Data.pagenum = 1;
                MMMB.search(MMMB.Data.searchtype);
            });

            /* 태그관리 이동 */
            $("#MMMB-btn-tagManage").click(function()
            {
                Navigation.moveFrontPage(Navigation.Page.B72GrpMemberTagList, {grpno: MMMB.Data.grpno});
            });

            /* ========================= */
            /* page process */
            /* ========================= */

            /* get data from Config */
            try
            {
                MMMB.Data = Navigation.getPageParam();
                Navigation.executeShow();
            }
            catch(e)
            {
                console.error(e);
                MMMB.close(true);
            }

        }); /* end function */

    </script>
</ons-page>
