<ons-page id="MMHM">

    <div class="common-div-headerTop">
        <table style="width:100%;">
            <tbody>
                <tr>
                    <td style="text-align:left;">
                        <div class="common-colorBody">안녕하세요</div>
                        <div class="common-colorHead"><span id="MMHM-span-username" class="common-strong" style="vertical-align:bottom;"></span>&nbsp;님</div>
                    </td>
                    <td style="text-align:right;">
                        <button id="MMHM-btn-toUser"    class="common-btn-inner  common-fonts09"><i class="ti ti-transform"></i>&nbsp;유저 홈</button>
                        <button id="MMHM-btn-toAdmin"   class="common-btn-inner  common-fonts09" style="display:none;"><i class="ti ti-power" aria-hidden="true"></i>&nbsp;관리자 홈</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ========================= -->
    <!-- 모임 -->
    <!-- ========================= -->
    <div class="common-div-cushion">
        <div id="MMHM-div-grp"></div>
    </div>

    <!-- ========================= -->
    <!-- 메뉴 -->
    <!-- ========================= -->
    <hr class="common-hr-paddingAA"/>
    <div class="common-menuTop common-div-cushion">
        <a id="MMHM-btn-classes" class="common-menuItem" href="#">
            <div class="common-menuItemIcon"><i class="ti ti-calendar-bolt"></i></div>
            <div class="common-menuItemText"><div>일정</div><div>일정 생성 및 참가관리</div></div>
            <!-- <span class="common-menuItemBadge" style="background:#EAF0FF;color:#3D6BF5;">진행중 2</span> -->
            <div class="common-menuItemArrow"><i class="ti ti-chevron-right"></i></div>
        </a>
        <a id="MMHM-btn-settle" class="common-menuItem" href="#">
            <div class="common-menuItemIcon"><i class="ti ti-credit-card"></i></div>
            <div class="common-menuItemText"><div>정산</div><div>실제 일정 후, 정산 및 현황확인</div></div>
            <!-- <span class="common-menuItemBadge" style="background:#EAF0FF;color:#3D6BF5;">진행중 2</span> -->
            <div class="common-menuItemArrow"><i class="ti ti-chevron-right"></i></div>
        </a>
        <a id="MMHM-btn-finance" class="common-menuItem" href="#">
            <div class="common-menuItemIcon"><i class="ti ti-report-money"></i></div>
            <div class="common-menuItemText"><div>재무</div><div>전체 재무현황 상세</div></div>
            <!-- <span class="common-menuItemBadge" style="background:#EAF0FF;color:#3D6BF5;">진행중 2</span> -->
            <div class="common-menuItemArrow"><i class="ti ti-chevron-right"></i></div>
        </a>
        <a id="MMHM-btn-members" class="common-menuItem" href="#">
            <div class="common-menuItemIcon"><i class="ti ti-users"></i></div>
            <div class="common-menuItemText"><div>멤버</div><div>모임멤버관리 및 조회</div></div>
            <!-- <span class="common-menuItemBadge" style="background:#EAF0FF;color:#3D6BF5;">진행중 2</span> -->
            <div class="common-menuItemArrow"><i class="ti ti-chevron-right"></i></div>
        </a>
        <a id="MMHM-btn-manage" class="common-menuItem" href="#">
            <div class="common-menuItemIcon"><i class="ti ti-settings"></i></div>
            <div class="common-menuItemText"><div>설정</div><div>모임관련 상세설정</div></div>
            <!-- <span class="common-menuItemBadge" style="background:#EAF0FF;color:#3D6BF5;">진행중 2</span> -->
            <div class="common-menuItemArrow"><i class="ti ti-chevron-right"></i></div>
        </a>
    </div>

    <script>
        var MMHM =
        {
            code: "MMHM",
            Data: {},

            /* =============== */
            /* show */
            /* =============== */
            show()
            {
                if(Common.isEmpty(MMHM.Data.grpno)) { Common.toast("잘못된 접근입니다."); MMHM.close(); return; }

                /* init */
                Common.showProgress();
                setTimeout(function()
                {
                    /* 공지사항 조회 */
                    /* let mSystemBoards = Api.SystemBoard.selectMain(); */
                    /* mSystemBoards.makeMainBanners("#MMHM-div-systemBoard"); */

                    /* 모임정보조회 */
                    let mGrp = Api.Grp.selectByPk(MMHM.Data.grpno);
                    let mUser = Api.User.selectMe().getModel();

                    /* validation */
                    if(mGrp == null)  { Common.error("모임정보가 없습니다."); return; }
                    if(mUser == null) { Common.error("유저정보가 없습니다."); return; }

                    /* to html */
                    $("#MMHM-div-grp").html(mGrp.make());
                    $("#MMHM-span-username").text(`${mUser.getName()}`);

                    /* check isManager */
                    if(GGstorage.Prj.isManagerOfGrp(MMHM.Data.grpno) == false)
                    {
                        Common.toast("매니저 권한이 없습니다.");
                        Navigation.moveHome();
                        return;
                    }

                    Common.hideProgress();
                }, ajaxDelayTime);

                // GGinitPage.setCartFab();

            },

            /* ========================= */
            /* close */
            /* ========================= */
            close(force=false)
            {
                if(force == true)
                {
                    Navigation.moveBack();
                    return;
                }
                Common.confirmExit();
            },
        };

        $(document).ready(function()
        {
            /* ======================== */
            /* set event */
            /* ======================== */
            $("#MMHM-btn-toUser")  .click(function() { GGstorage.clearPageStack(); Navigation.moveFrontPage(Navigation.Page.A11UserMainHome, {}); });
            $("#MMHM-btn-classes") .click(function() {                             Navigation.moveFrontPage(Navigation.Page.B12ManagerMainClasses , {grpno: MMHM.Data.grpno}); });
            $("#MMHM-btn-settle")  .click(function() {                             Navigation.moveFrontPage(Navigation.Page.B14ManagerMainSettle  , {grpno: MMHM.Data.grpno}); });
            $("#MMHM-btn-finance") .click(function() {                             Navigation.moveFrontPage(Navigation.Page.B1000GrpFinanceHome   , {grpno: MMHM.Data.grpno}); });
            $("#MMHM-btn-members") .click(function() {                             Navigation.moveFrontPage(Navigation.Page.B13ManagerMainMembers , {grpno: MMHM.Data.grpno}); });
            $("#MMHM-btn-manage")  .click(function() {                             Navigation.moveFrontPage(Navigation.Page.B80GrpManageHome      , {grpno: MMHM.Data.grpno}); });

            /* ------------ */
            /* logout */
            /* ------------ */
            $("#MMHM-btn-logout").click(function()
            {
                /* 로그아웃 함수 정의 */
                let logout = function()
                {
                    GGstorage.logout();
                };

                /* 로그아웃 실시 */
                Common.confirm
                ({
                    title : "로그아웃",
                    msg : "로그아웃하시겠습니까?",
                    okCallback : logout
                });
            });

            /* ========================= */
            /* page process */
            /* ========================= */

            /* get data from Config */
            try
            {
                MMHM.Data = Navigation.getPageParam();
                Navigation.executeShow();
            }
            catch(e)
            {
                console.error(e);
                MMHM.close(true);
            }

            /* localizing */
            /* $("#MMHM").i18n(); */

        }); /* end ready */
    </script>
</ons-page>
