<ons-page id="MMMG">

    <!-- ======================== -->
    <!-- 페이지용 타이틀 -->
    <!-- ======================== -->
    <div class="common-div-toolbar">
        <div><gg-backbtn onclick="MMMG.close(true);"></gg-backbtn></div>
        <div><span>관리</span></div>
    </div>

    <div class="common-menuTop common-div-cushion">
        <a id="MMMG-btn-manageUserAcctList" class="common-menuItem" href="#">
            <div class="common-menuItemIcon"><i class="ti ti-building-bank"></i></div>
            <div class="common-menuItemText"><div>계좌정보관리</div><div>모임 입금계좌 등록 및 관리</div></div>
            <div class="common-menuItemArrow"><i class="ti ti-chevron-right"></i></div>
        </a>
        <a id="MMMG-btn-manageUserLayer" class="common-menuItem" href="#">
            <div class="common-menuItemIcon"><i class="ti ti-user-shield"></i></div>
            <div class="common-menuItemText"><div>권한/직위설정</div><div>멤버별 직급, 직책, 재무권한 설정</div></div>
            <div class="common-menuItemArrow"><i class="ti ti-chevron-right"></i></div>
        </a>
        <a id="MMMG-btn-manageBacknumber" class="common-menuItem" href="#">
            <div class="common-menuItemIcon"><i class="ti ti-hash"></i></div>
            <div class="common-menuItemText"><div>등번호설정</div><div>멤버별 등번호 및 자릿수 설정</div></div>
            <div class="common-menuItemArrow"><i class="ti ti-chevron-right"></i></div>
        </a>
        <a id="MMMG-btn-manageBasecamp" class="common-menuItem" href="#">
            <div class="common-menuItemIcon"><i class="ti ti-map-pin"></i></div>
            <div class="common-menuItemText"><div>아지트설정</div><div>모임의 활동지역 및 주요거점 설정</div></div>
            <div class="common-menuItemArrow"><i class="ti ti-chevron-right"></i></div>
        </a>
        <a id="MMMG-btn-manageGrpIntro" class="common-menuItem" href="#">
            <div class="common-menuItemIcon"><i class="ti ti-info-circle"></i></div>
            <div class="common-menuItemText"><div>모임소개</div><div>한 줄 소개, 소개글, 운영원칙 작성</div></div>
            <div class="common-menuItemArrow"><i class="ti ti-chevron-right"></i></div>
        </a>
        <!-- <button id="MMMG-btn-manageUserAddr"           class="common-btn-outer">주소설정</button> -->
        <!-- <button id="MMMG-btn-manageUserAcctRefund"     class="common-btn-outer">환불계좌설정</button> -->
        <!-- <button id="MMMG-btn-paymentMissedreq"         class="common-btn-outer">오입금(오송금) 반환신청</button> -->
    </div>

    <script>
        var MMMG =
        {
            code: "MMMG",

            show()
            {
                if(Common.isEmpty(MMMG.Data.grpno)) { Common.toast("잘못된 접근입니다."); MMMG.close(); return; }
            },

            /* ========================= */
            /* close */
            /* ========================= */
            close(force=false)
            {
                Navigation.moveBack();
            },
        };

        $(document).ready(function()
        {
            /* ======================== */
            /* set event */
            /* ======================== */
            $("#MMMG-btn-manageUserAcctList") .click(function() {Navigation.moveFrontPage(Navigation.Page.B81ManagerBankacctList   , {grpno: MMMG.Data.grpno}); });
            $("#MMMG-btn-manageUserLayer")    .click(function() {Navigation.moveFrontPage(Navigation.Page.B85ManagerMemberLayering , {grpno: MMMG.Data.grpno}); });
            $("#MMMG-btn-manageBacknumber")   .click(function() {Navigation.moveFrontPage(Navigation.Page.B86ManagerUpdateBacknumberlength , {grpno: MMMG.Data.grpno}); });
            $("#MMMG-btn-manageBasecamp")     .click(function() {Navigation.moveFrontPage(Navigation.Page.B87ManagerUpdateBasecamp , {grpno: MMMG.Data.grpno}); });
            $("#MMMG-btn-manageGrpIntro")     .click(function() {Navigation.moveFrontPage(Navigation.Page.B88ManagerUpdateGrpIntro , {grpno: MMMG.Data.grpno}); });
            // $("#MMMG-btn-manageUserAddr")         .click(function() {Navigation.moveFrontPage(Navigation.Page.A1021UserAddrList, {}); });
            // $("#MMMG-btn-manageUserAcctRefund")   .click(function() {Navigation.moveFrontPage(Navigation.Page.B32UserBaccnoRefundUpdate, {}); });
            // $("#MMMG-btn-paymentMissedreq")       .click(function() {Navigation.moveFrontPage(Navigation.Page.B33UserPaymentMissedreq, {}); });


            /* ========================= */
            /* page process */
            /* ========================= */

            /* get data from Config */
            try
            {
                MMMG.Data = Navigation.getPageParam();
                Navigation.executeShow();
            }
            catch(e)
            {
                console.error(e);
                MMMG.close(true);
            }

        });
    </script>
</ons-page>
