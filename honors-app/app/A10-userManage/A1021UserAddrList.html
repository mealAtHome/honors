<ons-page id="UALI">

    <!-- ======================== -->
    <!-- 페이지용 타이틀 -->
    <!-- ======================== -->
    <div class="common-div-toolbar">
        <div><gg-backbtn onclick="UALI.close(true);"></gg-backbtn></div>
        <div><span>주소관리</span></div>
    </div>

    <div class="common-div-cushion">
        <button id="UALI-btn-addAddr" class="common-btn-inner" style="width:100%; box-sizing:border-box;">＋ 새로운 주소</button>
    </div>

    <!-- ======================== -->
    <!-- 주소리스트 -->
    <!-- ======================== -->
    <div id="UALI-div-userAddrList" class="common-div-cushion"></div>

    <script>
        var UALI =
        {
            code : "UALI",
            Data : {},

            show()
            {
                Common.showProgress();
                setTimeout(function()
                {
                    let mUser = Api.User.selectMe().getModel();
                    UALI.Data.userno = mUser.getUserno();

                    let mUserAddrs = Api.UserAddr.selectByUsernoForUsr(UALI.Data.userno, GGF.none, GGF.toast);
                    mUserAddrs.make("#UALI-div-userAddrList");

                    Common.hideProgress();
                }, ajaxDelayTime);
            },

            /* ========================= */
            /* close */
            /* ========================= */
            close(force=false)
            {
                Navigation.moveBack();
            },
        }

        $(document).ready(function()
        {
            /* ========================= */
            /* event */
            /* ========================= */
            $("#UALI-btn-addAddr").click(function()
            {
                Navigation.moveFrontPage(Navigation.Page.A1022UserAddrUpdate, {option: "insert"});
            });

            $("#UALI-div-userAddrList").on("click", ".MUserAddr-make-btn-edit", function()
            {
                let useraddridx = $(this).attr("useraddridx");
                Navigation.moveFrontPage(Navigation.Page.A1022UserAddrUpdate, {option: "update", useraddridx: useraddridx});
            });

            $("#UALI-div-userAddrList").on("click", ".MUserAddr-make-btn-setDefault", function()
            {
                let useraddridx = $(this).attr("useraddridx");
                Common.showProgress();
                setTimeout(function()
                {
                    let mApiResponse = Api.UserAddr.updateDefaultForMng(UALI.Data.userno, useraddridx, GGF.none, GGF.toast);
                    if(mApiResponse.isSuccess())
                    {
                        Navigation.executeShow();
                        return;
                    }
                    Common.hideProgress();
                }, ajaxDelayTime);
            });

            $("#UALI-div-userAddrList").on("click", ".MUserAddr-make-btn-delete", function()
            {
                let useraddridx = $(this).attr("useraddridx");
                let process = function()
                {
                    Common.showProgress();
                    setTimeout(function()
                    {
                        let mApiResponse = Api.UserAddr.deleteForMng(UALI.Data.userno, useraddridx, GGF.none, GGF.toast);
                        if(mApiResponse.isSuccess())
                        {
                            Navigation.executeShow();
                            return;
                        }
                        Common.hideProgress();
                    }, ajaxDelayTime);
                };
                Common.confirm2("이 주소를 삭제하시겠습니까? 이 주소를 사용중인 모임이 있다면, 해당 모임의 표시주소가 초기화됩니다.", process);
            });

            /* ========================= */
            /* page process */
            /* ========================= */

            /* get data from Config */
            try
            {
                UALI.Data = Navigation.getPageParam();
                Navigation.executeShow();
            }
            catch(e)
            {
                console.error(e);
                UALI.close(true);
            }

        }); /* end function */

    </script>
</ons-page>
