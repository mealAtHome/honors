<ons-page id="UGAM">

    <!-- ======================== -->
    <!-- 페이지용 타이틀 -->
    <!-- ======================== -->
    <div class="common-div-toolbar">
        <div><gg-backbtn onclick="UGAM.close(true);"></gg-backbtn></div>
        <div><span>모임관리</span></div>
    </div>

    <div class="common-div-cushion">
        <ul class="common-ul-announce">
            <li>모임별로 다른 멤버들에게 보여줄 동네를 선택할 수 있습니다. 거리계산에는 사용되지 않습니다.</li>
        </ul>
    </div>

    <style>
        #UGAM-tbl-grpAddr { width:100%; }
        #UGAM-tbl-grpAddr > tbody > tr > td:nth-child(2) { width:9em; }
    </style>
    <div class="common-div-cushion">
        <table id="UGAM-tbl-grpAddr" class="common-tbl-normal common-fonts09" tbl-type="rowborder">
            <thead>
                <tr>
                    <th>모임</th>
                    <th>표시주소</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        var UGAM =
        {
            code : "UGAM",
            Data : {},

            show()
            {
                Common.showProgress();
                setTimeout(function()
                {
                    let mUser = Api.User.selectMe().getModel();
                    UGAM.Data.userno = mUser.getUserno();

                    let mUserAddrs = Api.UserAddr.selectByUsernoForUsr(UGAM.Data.userno, GGF.none, GGF.toast);
                    let mGrpMembers = Api.GrpMember.selectByExecutorForAll(GGF.none, GGF.toast);

                    let $tbody = $("#UGAM-tbl-grpAddr > tbody");
                    $tbody.html("");
                    for(let i in mGrpMembers.getModels())
                    {
                        let model = mGrpMembers.getModels()[i];
                        let tr =
                        `
                            <tr grpno="${model.getGrpno()}">
                                <td>${model.getGrpname()}</td>
                                <td><select class="UGAM-select-useraddridx common-select-outer" grpno="${model.getGrpno()}"></select></td>
                            </tr>
                        `;
                        $tbody.append(tr);

                        let $select = $tbody.find(`select[grpno="${model.getGrpno()}"]`);
                        mUserAddrs.makeOption($select);
                        $select.val(model.getUseraddridx());
                    }

                    Common.hideProgress();
                }, ajaxDelayTime);
            },

            /* ========================= */
            /* close */
            /* ========================= */
            close(force=false)
            {
                Navigation.moveBack();
            },
        }

        $(document).ready(function()
        {
            /* ======================== */
            /* event */
            /* ======================== */
            $("#UGAM-tbl-grpAddr").on("change", ".UGAM-select-useraddridx", function()
            {
                let grpno = $(this).attr("grpno");
                let useraddridx = $(this).val();

                Common.showProgress();
                setTimeout(function()
                {
                    let mApiResponse = Api.GrpMember.updateUseraddridxForUsr(grpno, useraddridx, GGF.none, GGF.toast);
                    if(mApiResponse.isSuccess())
                        Common.toastSuccess("변경되었습니다.");
                    Common.hideProgress();
                }, ajaxDelayTime);
            });

            /* ========================= */
            /* page process */
            /* ========================= */

            /* get data from Config */
            try
            {
                UGAM.Data = Navigation.getPageParam();
                Navigation.executeShow();
            }
            catch(e)
            {
                console.error(e);
                UGAM.close(true);
            }

        }); /* end function */

    </script>
</ons-page>
