<ons-page id="UMPP">

    <div class="common-div-toolbar">
        <div><gg-backbtn onclick="UMPP.close(true);"></gg-backbtn></div>
        <div><span>전화번호공개설정</span></div>
    </div>

    <!-- ======================== -->
    <!-- main page -->
    <!-- ======================== -->
    <div class="common-div-cushion">

        <div class="common-div-cushionUD">
            <ul class="common-ul-announce">
                <li>전화번호를 누구에게 보여줄지 정합니다. 본인에게는 항상 보입니다.</li>
                <li>급한 연락이 필요할 수 있어, 모임 운영진(매니저·부매니저)에게는 항상 공개됩니다.</li>
                <li>아래 모임별설정에서 모임마다 다르게 정할 수 있습니다.</li>
            </ul>
        </div>

        <style>
            #UMPP .common-tbl-type th > .common-btn-radio { width: 6.5em; }
            #UMPP-tbl-grpList > thead > tr > th,
            #UMPP-tbl-grpList > tbody > tr > td { text-align: left; vertical-align: middle; }
            #UMPP-tbl-grpList select { width: 100%; min-width: 9.5em; font-size: 0.95em; }
        </style>

        <div class="common-div-cushionUD">
            <p class="common-p-title">전체설정</p>
            <table id="UMPP-tbl-userPrivPhone" class="common-tbl-vertical common-tbl-type common-fonts09" tbl-type="rowborder">
                <tbody>
                    <tr><th><button class="UMPP-btn-userPrivPhone commonEvent-btn-radio common-btn-radio" radio_name="UMPP-btn-userPrivPhone" val="all" tab="">전체공개</button></th><td>모든 사용자에게 공개됩니다.</td></tr>
                    <tr><th><button class="UMPP-btn-userPrivPhone commonEvent-btn-radio common-btn-radio" radio_name="UMPP-btn-userPrivPhone" val="grp" tab="">모임공개</button></th><td>같은 모임 멤버에게만 공개됩니다.</td></tr>
                    <tr><th><button class="UMPP-btn-userPrivPhone commonEvent-btn-radio common-btn-radio" radio_name="UMPP-btn-userPrivPhone" val="mng" tab="">운영진공개</button></th><td>모임의 매니저·부매니저에게만 공개됩니다.</td></tr>
                </tbody>
            </table>
        </div>

        <div class="common-div-cushionUD">
            <hr class="common-hr-paddingUD03"/>
            <p class="common-p-title">모임별설정</p>
            <table id="UMPP-tbl-grpList" class="common-tbl-normal common-fonts09" tbl-type="rowborder" style="width:100%;">
                <thead>
                    <tr>
                        <th>모임명</th>
                        <th style="width:10.5em;">공개범위</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- ======================== -->
        <!-- footer -->
        <!-- ======================== -->
        <button id="UMPP-btn-save" class="common-btn-footer">저장하기</button>
        <div class="common-div-cushionFooter"></div>

    </div>

    <script>

        var UMPP =
        {
            code : "UMPP",
            userImgUri: null,
            Data: {},

            show()
            {
                Common.showProgress();
                setTimeout(function()
                {
                    /* get user info */
                    let mUser = Api.User.selectMe().getModel();
                    if(mUser == null)
                    {
                        UMPP.close(true);
                        return;
                    }
                    $(".UMPP-btn-userPrivPhone").attr("tab", "");
                    $(`.UMPP-btn-userPrivPhone[val="${mUser.getPrivPhone() || GGF.GrpmPrivacy.PrivPhone.GRP}"]`).attr("tab", "tab");

                    /* 모임별 : 게스트(용병)로만 참가한 모임은 제외 */
                    let options =
                    [
                        ["not", "전체설정에 따름"],
                        [GGF.GrpmPrivacy.PrivPhone.ALL, "전체공개"],
                        [GGF.GrpmPrivacy.PrivPhone.GRP, "모임공개"],
                        [GGF.GrpmPrivacy.PrivPhone.MNG, "운영진공개"],
                    ];
                    let html = "";
                    let mGrpMembers = Api.GrpMember.selectByExecutorForAll().getModels();
                    for(let i in mGrpMembers)
                    {
                        let mGrpMember = mGrpMembers[i];
                        if(mGrpMember.getGrpmtype() == GGF.GrpMember.Grpmtype.GUEST)
                            continue;
                        let cur = mGrpMember.getPrivPhone() == "" ? "not" : mGrpMember.getPrivPhone();
                        let optHtml = options.map(o => `<option value="${o[0]}" ${o[0] == cur ? "selected" : ""}>${o[1]}</option>`).join("");
                        html +=
                        `
                            <tr grpno="${mGrpMember.getGrpno()}">
                                <td>${GGC.Common.escapeHtml(mGrpMember.getGrpname())}</td>
                                <td><select class="UMPP-select-privPhone common-input-text">${optHtml}</select></td>
                            </tr>
                        `;
                    }
                    if(html == "")
                        html = `<tr><td colspan="2" class="common-colorCmmt">가입한 모임이 없습니다.</td></tr>`;
                    $("#UMPP-tbl-grpList > tbody").html(html);

                    Common.hideProgress();
                }, ajaxDelayTime);

            },

            close()
            {
                Navigation.moveBack();
            },
        };


        $(document).ready(function()
        {
            /* =============================== */
            /* events */
            /* =============================== */

            /* ---------------------- */
            /* 저장하기 */
            /* ---------------------- */
            $("#UMPP-btn-save").click(function()
            {
                let privPhone = $('.UMPP-btn-userPrivPhone[tab="tab"]').attr("val");
                let privPhoneGrpm = [];
                $("#UMPP-tbl-grpList > tbody > tr[grpno]").each(function()
                {
                    privPhoneGrpm.push({ GRPNO: $(this).attr("grpno"), PRIV_PHONE: $(this).find(".UMPP-select-privPhone").val() });
                });

                let process = function()
                {
                    Common.showProgress();
                    setTimeout(function()
                    {
                        Api.User.updatePhonePrivacyByPk(privPhone, privPhoneGrpm, GGF.toast, GGF.toast);

                        Common.hideProgress();
                    }, ajaxDelayTime);
                }
                Common.confirm2("저장하시겠습니까?", process);
            });

            /* ========================= */
            /* page process */
            /* ========================= */

            /* get data from Config */
            try
            {
                UMPP.Data = Navigation.getPageParam();
                Navigation.executeShow();
            }
            catch(e)
            {
                console.error(e);
                UMPP.close(true);
            }

            /* localizing */
            /* $("#UMPP").i18n(); */

        });

    </script>
</ons-page>
